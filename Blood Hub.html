<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blood Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F9;--surf:#fff;--ink:#12263A;--mute:#5A6B7B;--line:#D9E1E8;--pri:#0F5C7A;--prifg:#fff;--soft:#E6F1F6;--crit:#B3122F;--low:#9A5B00;--ok:#1F7A66;--critbg:#FBE9EC;--lowbg:#FBF0DC;--okbg:#E3F3EE;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A24;--surf:#15242F;--ink:#E7EEF3;--mute:#98AAB8;--line:#2A3C4A;--pri:#5BB8D9;--prifg:#0E1A24;--soft:#183444;--crit:#FF7088;--low:#F0B04A;--ok:#4CC3A4;--critbg:#3A1A22;--lowbg:#3A2D14;--okbg:#14332B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A24;--surf:#15242F;--ink:#E7EEF3;--mute:#98AAB8;--line:#2A3C4A;--pri:#5BB8D9;--prifg:#0E1A24;--soft:#183444;--crit:#FF7088;--low:#F0B04A;--ok:#4CC3A4;--critbg:#3A1A22;--lowbg:#3A2D14;--okbg:#14332B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:30}
a{color:inherit}
.wrap{max-width:1120px;margin:auto;padding:0 18px}
header{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hb1{display:flex;align-items:center;gap:18px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;text-decoration:none;display:flex;gap:9px;align-items:center;color:var(--pri)}
.drop{width:13px;height:17px;background:var(--crit);border-radius:50% 50% 50% 50%/65% 65% 35% 35%}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav a{padding:8px 12px;text-decoration:none;color:var(--mute);font-weight:500;border-radius:6px;white-space:nowrap}
nav a.on{background:var(--soft);color:var(--pri);font-weight:700}
select,input{font:inherit;color:inherit;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:6px;padding:8px 14px;text-decoration:none;display:inline-block}
.p{background:var(--pri);border-color:var(--pri);color:var(--prifg);font-weight:700}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
main{padding:26px 0 56px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.2}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px;max-width:66ch}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;align-items:center;padding:20px 0 10px}
.hero h1{font-size:42px;letter-spacing:-.03em;line-height:1.1;margin-bottom:14px}
.hero p{font-size:17px;color:var(--mute);max-width:52ch}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi span{color:var(--mute);font-size:13px}
.hb{display:grid;gap:5px}
.hr{display:grid;grid-template-columns:48px 1fr 74px;gap:10px;align-items:center;border:0;background:none;padding:5px 6px;border-radius:6px;text-align:left;width:100%}
.hr.on{background:var(--soft)}
.hl{font-weight:700}.hv{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.ht{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;display:block}
.ht i{display:block;height:100%;border-radius:6px}
.fcrit{background:var(--crit)}.flow{background:var(--low)}.fok{background:var(--ok)}.fpri{background:var(--pri)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.crit,td.crit{background:var(--critbg);color:var(--crit)}.pill.low,td.low{background:var(--lowbg);color:var(--low)}.pill.ok,td.ok{background:var(--okbg);color:var(--ok)}
.tw{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:left}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.form label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--pri);color:var(--prifg)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surf);margin-bottom:8px}
.row .g{flex:1;min-width:200px}
.note{font-size:13px;color:var(--mute)}
.crit{color:var(--crit)}.low{color:var(--low)}.ok{color:var(--ok)}
.step{font-weight:800;color:var(--pri);font-size:13px}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--mute);font-size:13px;background:var(--surf)}
svg text{fill:var(--mute);font:11px "Public Sans",system-ui,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--mute)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:var(--crit);color:var(--bg);border-radius:99px;font-size:11px;padding:0 7px;margin-left:6px;font-weight:700}.portal{border-top:4px solid var(--pri)}.portal.bank{border-top-color:var(--crit)}.tag{font-size:12px;font-weight:700;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}.band{background:var(--pri);color:var(--prifg);border-radius:12px;padding:28px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.band h2{margin:0 0 4px;font-size:22px}.band p{margin:0;opacity:.9}.band .btn{background:var(--crit);border-color:var(--crit);color:#fff;font-weight:700}.fl{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap}.fl a{text-decoration:none;font-weight:600;color:var(--pri)}details.q{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px}details.q summary{cursor:pointer;font-weight:700}details.q p{margin:8px 0 0;color:var(--mute)}.demo{display:inline-block;font-size:11px;font-weight:700;color:var(--low);background:var(--lowbg);border-radius:99px;padding:1px 9px;margin-left:8px;vertical-align:middle}.sec{margin-top:40px}.otp{background:var(--lowbg);color:var(--low);border-radius:8px;padding:10px 12px;font-weight:600}textarea{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:110px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}.hb1{gap:10px}.tools{width:100%}nav{order:3;width:100%;flex:none}main{padding-top:18px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const T=['O-','O+','A-','A+','B-','B+','AB-','AB+'];
const SH={'O-':.07,'O+':.37,'A-':.06,'A+':.27,'B-':.02,'B+':.09,'AB-':.01,'AB+':.03};
const COMP={'O-':['O-'],'O+':['O+','O-'],'A-':['A-','O-'],'A+':['A+','A-','O+','O-'],'B-':['B-','O-'],'B+':['B+','B-','O+','O-'],'AB-':['AB-','A-','B-','O-'],'AB+':['AB+','AB-','A+','A-','B+','B-','O+','O-']};
const SC={normal:['Normal operations',1],festival:['Holiday or festival week',1.3],incident:['Major incident nearby',2.2]};
const WK=[1.05,.98,1,1,1.03,1.14,1.1];
const NAV=[['home','Home'],['dashboard','Dashboard'],['inventory','Inventory'],['prediction','AI predictions'],['find','Find blood'],['hospitals','Hospitals'],['banks','Blood banks'],['about','About us']];
const EXTRA=['signin','signup','profile','alerts','reports','faq','directory','privacy','contact'],PUB=['signin','signup','about','faq','privacy','contact'];
const lab={crit:'Critical',low:'Low',ok:'Stable'};
const L=t=>t.replace('-','−');
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length;
const D0=new Date().getDay(),dw=i=>(((D0-(29-i))%7)+7)%7;
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const st=c=>c<2?'crit':c<4?'low':'ok';
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const dist=(a,b)=>Math.round(Math.hypot(a.x-b.x,a.y-b.y)*10)/10;
function seed(){const r=rng(7);
 const hubs=[['City General',0,0,60],['Riverside Trauma',6,4,45],['East Medical',-8,3,35],['Airport Clinic',3,-9,20],['University Hospital',-5,-7,50]].map((h,i)=>{const o={id:i,name:h[0],x:h[1],y:h[2],size:h[3],s:{}};T.forEach(t=>{const u=Math.round(h[3]*SH[t]*(0.8+r()*8));o.s[t]={u,e:Math.round(u*r()*.22)}});return o});
 const hist={};T.forEach(t=>{const b=210*SH[t];hist[t]=Array.from({length:30},(_,i)=>Math.round(b*(1+.004*i)*WK[dw(i)]*(.88+r()*.24)*10)/10)});
 const banks=[['Central Blood Bank',-2,2],['Regional Donor Centre',8,-3],['Community Collection Point',-6,-1]].map((b,i)=>{const o={id:i,name:b[0],x:b[1],y:b[2],s:{}};T.forEach(t=>{const u=Math.round(60*SH[t]*(2+r()*9));o.s[t]={u,e:Math.round(u*r()*.2)}});return o});
 return{hubs,hist,banks}}
const iso=d=>{const t=new Date(Date.now()+d*864e5);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')},dto=x=>Math.round((new Date(x+'T00:00:00')-new Date(iso(0)+'T00:00:00'))/864e5);
const fixF=A=>{A.forEach(f=>T.forEach(t=>{const s=f.s[t];if(s.r==null)s.r=Math.floor(s.u*.1);if(!s.c)s.c=iso(-(3+(f.id*5+t.length*3)%20));if(!s.x)s.x=iso(s.e>0?1+(f.id+t.length)%5:8+(f.id*7+t.length*5)%28)}));return A};
const BASE=seed();fixF(BASE.hubs);fixF(BASE.banks);
function model(s,n,sc=1){const m=s.length,last=s.slice(-28),mu=mean(last);
 const ix=[0,1,2,3,4,5,6].map(w=>{const v=last.filter((_,k)=>dw(m-last.length+k)===w);return v.length?mean(v)/mu:1});
 const ds=s.map((v,i)=>v/ix[dw(i)]),y=ds.slice(-14),xs=y.map((_,i)=>i),mx=mean(xs),my=mean(y);
 const sl=sum(xs.map((x,i)=>(x-mx)*(y[i]-my)))/sum(xs.map(x=>(x-mx)**2));
 const sg=Math.sqrt(mean(y.map((v,i)=>(v-(my+sl*(i-mx)))**2))),lv=my+sl*(y.length-1-mx);
 const f=[],lo=[],hi=[];for(let d=1;d<=n;d++){const w=ix[dw(m-1+d)],c=Math.max(0,(lv+sl*d*.6)*w*sc);f.push(c);lo.push(Math.max(0,c-1.28*sg*w*sc));hi.push(c+1.28*sg*w*sc)}
 return{f,lo,hi}}
const wape=s=>{const p=model(s.slice(0,23),7).f,a=s.slice(23);return sum(a.map((v,i)=>Math.abs(v-p[i])))/sum(a)*100};
const units=(hubs,t)=>sum(hubs.map(h=>h.s[t].u));
const runout=(stock,f)=>{let c=0;for(let i=0;i<f.length;i++){c+=f[i];if(c>=stock)return i+1}return null};

const Pill=({s})=>html`<span className=${'pill '+s}>${lab[s]}</span>`;
const HBar=({rows,sel,on})=>{const mx=Math.max(...rows.map(r=>r.v),1);return html`<div className="hb">${rows.map(r=>html`<button key=${r.k} className=${'hr'+(sel===r.k?' on':'')} onClick=${()=>on&&on(r.k)} disabled=${!on} aria-label=${r.l+': '+r.v}><span className="hl">${r.l}</span><span className="ht"><i className=${'f'+(r.s||'pri')} style=${{width:(r.v/mx*100)+'%'}}></i></span><span className="hv">${r.v}</span></button>`)}</div>`};
function Line({hist,f,lo,hi}){const[h,sh]=useState(null);const n=hist.length+f.length,W=680,H=250,P={l:38,r:10,t:12,b:26};
 const mx=Math.max(...hist,...hi)*1.1||1,X=i=>P.l+i*(W-P.l-P.r)/(n-1),Y=v=>H-P.b-v/mx*(H-P.t-P.b),k=hist.length;
 const hp=hist.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join(' ');
 const fp=[hist[k-1],...f].map((v,i)=>(i?'L':'M')+X(k-1+i)+','+Y(v)).join(' ');
 const band=hi.map((v,i)=>(i?'L':'M')+X(k+i)+','+Y(v)).join(' ')+lo.map((v,i)=>'L'+X(k+lo.length-1-i)+','+Y(lo[lo.length-1-i])).join(' ')+'Z';
 const mv=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;sh(Math.max(0,Math.min(n-1,Math.round((x-P.l)/((W-P.l-P.r)/(n-1))))))};
 const val=h==null?null:h<k?hist[h]:f[h-k],off=h==null?0:h-(k-1);
 return html`<svg viewBox=${'0 0 '+W+' '+H} width="100%" onMouseMove=${mv} onMouseLeave=${()=>sh(null)} role="img" aria-label="Daily demand history and forecast">
 ${[0,.5,1].map(q=>html`<g key=${q}><line x1=${P.l} x2=${W-P.r} y1=${Y(mx/1.1*q)} y2=${Y(mx/1.1*q)} stroke="var(--line)"/><text x=${P.l-6} y=${Y(mx/1.1*q)+4} textAnchor="end">${Math.round(mx/1.1*q)}</text></g>`)}
 <path d=${band} fill="var(--pri)" opacity=".15"/><path d=${hp} fill="none" stroke="var(--ink)" strokeWidth="2"/><path d=${fp} fill="none" stroke="var(--pri)" strokeWidth="2.5" strokeDasharray="5 4"/>
 <line x1=${X(k-1)} x2=${X(k-1)} y1=${P.t} y2=${H-P.b} stroke="var(--line)"/>
 <text x=${X(k-1)-4} y=${H-8} textAnchor="end">Past 30 days</text><text x=${X(k-1)+4} y=${H-8}>Forecast</text>
 ${h!=null&&html`<g><line x1=${X(h)} x2=${X(h)} y1=${P.t} y2=${H-P.b} stroke="var(--pri)"/><circle cx=${X(h)} cy=${Y(val)} r="4" fill="var(--pri)"/><text x=${Math.min(X(h)+8,W-170)} y=${P.t+10} style=${{fill:'var(--ink)',fontWeight:700}}>${off===0?'Today':off<0?off+' d':'+'+off+' d'}: ${val.toFixed(1)} units${h>=k?' ('+lo[h-k].toFixed(0)+'–'+hi[h-k].toFixed(0)+')':''}</text></g>`}
 </svg>`}

const Logo=({big})=>html`<svg viewBox="0 0 40 40" width=${big?120:30} height=${big?120:30} aria-hidden="true"><path d="M20 3C20 3 7 17 7 25a13 13 0 0 0 26 0C33 17 20 3 20 3z" fill="var(--crit)"/><path d="M10 25h6l2-5 4 9 3-6 1.5 2H30" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>`;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function userLogin(e,pw,acc){try{e=e.trim().toLowerCase();if(e==='demo.user@example.com'&&pw===PW)return{email:e,name:'Demo user'};const a=acc.find(x=>x.email===e);return a&&a.ph===await sha(e+':'+pw)?a:null}catch(x){return null}}
const Demo=()=>html`<span className="demo">Demo data</span>`;
function SignUp({ctx}){const[s,setS]=useState(1),[f,setF]=useState({name:'',email:'',phone:'',pw:'',pw2:'',ok:false}),[er,setEr]=useState(''),[otp,setOtp]=useState(null),[code,setCode]=useState(''),[left,setLeft]=useState(3);
 const set=k=>e=>setF({...f,[k]:e.target.type==='checkbox'?e.target.checked:e.target.value}),mk=()=>{setOtp({c:String(Math.floor(100000+Math.random()*900000)),t:Date.now()});setLeft(3);setCode('');setEr('')};
 const next=()=>{const e=f.email.trim().toLowerCase();
  if(f.name.trim().length<2)return setEr('Enter your full name.');if(!/^\S+@\S+\.\S+$/.test(e))return setEr('Enter a valid email address.');if(!/^\+?\d{10,15}$/.test(f.phone.replace(/[\s-]/g,'')))return setEr('Enter a phone number with 10 to 15 digits.');if(f.pw.length<8||!/\d/.test(f.pw)||!/[a-zA-Z]/.test(f.pw))return setEr('Use a password of at least 8 characters with letters and a number.');if(f.pw!==f.pw2)return setEr('Passwords do not match.');if(!f.ok)return setEr('Please accept the privacy notice.');if(e==='demo.user@example.com'||ctx.accounts.some(a=>a.email===e))return setEr('An account with this email already exists. Sign in instead.');
  mk();setS(2)};
 const verify=async()=>{if(Date.now()-otp.t>3e5)return setEr('The code expired. Request a new one.');if(left<1)return setEr('Too many attempts. Request a new code.');if(code.trim()!==otp.c){const l=left-1;setLeft(l);return setEr(l>0?'Incorrect code. '+l+' attempt'+(l>1?'s':'')+' left.':'Too many attempts. Request a new code.')}
  const e=f.email.trim().toLowerCase();let ph;try{ph=await sha(e+':'+f.pw)}catch(x){return setEr('Your browser cannot protect the password here. Try another browser.')}
  const a={name:f.name.trim(),email:e,phone:f.phone.replace(/[\s-]/g,''),ph,created:new Date().toISOString(),otpDemo:true};ctx.setAccounts([...ctx.accounts,a]);ctx.setSess({role:'user',id:e,name:a.name,email:e});ctx.toast('Account created');location.hash='#home'};
 const fld=(k,l,t,ac)=>html`<label>${l}<input type=${t||'text'} value=${f[k]} onChange=${set(k)} autoComplete=${ac||'off'}/></label>`;
 return html`<div className="wrap" style=${{maxWidth:520}}><h1>Create an account</h1><p className="sub">Step ${s} of 2: ${s===1?'your details':'verify your contact details'}.</p>
 ${s===1?html`<form className="card" onSubmit=${e=>{e.preventDefault();next()}}><div className="form" style=${{display:'grid'}}>${fld('name','Full name','text','name')}${fld('email','Email','email','email')}${fld('phone','Phone number, for example +911234567890','tel','tel')}${fld('pw','Password, 8 or more characters with a number','password','new-password')}${fld('pw2','Confirm password','password','new-password')}<label style=${{display:'flex',gap:8,alignItems:'center'}}><input type="checkbox" checked=${f.ok} onChange=${set('ok')}/>I accept the <a href="#privacy">privacy notice</a></label>${er&&html`<div className="crit" role="alert">${er}</div>`}<button className="p" type="submit">Send verification code</button></div></form>`
